name: Aether Field Instrument Challenge
on:
  push:
    branches: [main]
    paths: ['experiments/aether-field-instrument/**', '.github/workflows/aether-field.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/aether-field-instrument
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-field-challenge
          path: experiments/aether-field-instrument/reports
