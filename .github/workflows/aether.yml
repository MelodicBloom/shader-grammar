name: Aether visual QA and runtime
on:
  push:
    branches: [main]
    paths: ["experiments/aether-observatory/**", ".github/workflows/aether.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/aether-observatory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: experiments/aether-observatory/reports
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/aether-observatory/dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
